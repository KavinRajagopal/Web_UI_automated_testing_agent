[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: Smoke tests
    regression: Regression tests
    login: Login related tests
    security: security tests
    positive: positive tests
    sorting: sorting tests
    negative: negative tests
    P1: P1 tests
    P2: P2 tests
    edge_case: edge_case tests
    smoke: smoke tests
    P0: P0 tests
    products: products tests
    boundary: boundary tests
    validation: validation tests
    login: login tests
